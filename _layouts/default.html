<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#6b6a65;--line:#e6e3dc;--card:#fff;--accent:#2f5d50;--chip:#eef3f1;--chip-fg:#2f5d50}
@media (prefers-color-scheme:dark){:root{--bg:#141513;--fg:#e9e7e1;--muted:#9a978f;--line:#2b2c29;--card:#1b1c1a;--accent:#8cc5b0;--chip:#22302b;--chip-fg:#a9d6c4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em;color:var(--fg);text-decoration:none}
.brand span{color:var(--accent)}
nav a{color:var(--muted);text-decoration:none;margin-left:16px;font-size:14px}
nav a:hover{color:var(--accent)}
main{padding:28px 0 64px}
h1{font-size:28px;line-height:1.3;margin:0 0 8px}
h2{font-size:20px;margin:36px 0 10px;padding-top:8px;border-top:1px solid var(--line)}
h3{font-size:17px;margin:24px 0 6px}
a{color:var(--accent)}
.meta{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--chip);color:var(--chip-fg);border:0;border-radius:999px;padding:2px 10px;font-size:12px;font-family:inherit;cursor:default}
button.chip{cursor:pointer;opacity:.7}
button.chip.on{opacity:1;outline:1.5px solid var(--chip-fg)}
.list{list-style:none;padding:0;margin:16px 0}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.item a.t{font-weight:600;font-size:17px;text-decoration:none;color:var(--fg)}
.item a.t:hover{color:var(--accent)}
.item p{margin:6px 0 0;color:var(--muted);font-size:15px}
blockquote{margin:12px 0;padding:4px 14px;border-left:3px solid var(--accent);color:var(--muted)}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:.9em}
table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:18px 0 40px}
.empty{color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}">Research <span>Radar</span></a>
  <nav>
    <a href="{{ '/' | relative_url }}">每周简报</a>
    <a href="{{ '/competitors/' | relative_url }}">竞品动态</a>
    <a href="{{ site.repo_url }}">GitHub</a>
  </nav>
</div></header>
<main><div class="wrap">
{{ content }}
</div></main>
<footer><div class="wrap">内容由定时任务每周日自动整理，仅基于公开来源。</div></footer>
</body>
</html>
