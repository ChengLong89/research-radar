---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <div class="meta">{{ page.date | date: "%Y-%m-%d" }}{% if page.kind == "competitors" %} · 竞品动态{% endif %}</div>
  {% if page.topics %}<div class="chips">{% for t in page.topics %}<span class="chip">{{ site.topic_labels[t] | default: t }}</span>{% endfor %}</div>{% endif %}
  {{ content }}
</article>
<p class="meta"><a href="{% if page.kind == 'competitors' %}{{ '/competitors/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">← 返回列表</a></p>
